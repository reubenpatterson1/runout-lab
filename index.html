<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runout Lab</title>
<meta name="theme-color" content="#0a0e0c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Runout Lab">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --bg:#0a0e0c; --panel:#101814; --panel2:#0c110e;
  --brass:#c8a24c; --brass2:#ecd28a; --brass-dim:#8f7536;
  --ink:#ece7d6; --muted:#899389; --faint:#5a655c;
  --chalk:#54b6d6; --amber:#e7a23e; --green:#62b986;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --shadow:0 22px 60px rgba(0,0,0,.55);
  --red:#df6a4f; --rail:#241b12; --rail2:#160f09;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 700px at 78% -8%, rgba(200,162,76,.10), transparent 60%),
    radial-gradient(900px 600px at 8% 110%, rgba(34,90,64,.18), transparent 55%),
    var(--bg);
  color:var(--ink); font-family:"Archivo",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.5; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.035'/></svg>");
}
.wrap{position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:0 18px 80px}
header.top{
  position:sticky; top:0; z-index:50; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  background:linear-gradient(180deg, rgba(10,14,12,.94), rgba(10,14,12,.72));
  border-bottom:1px solid var(--line);
}
.bar{max-width:1180px; margin:0 auto; padding:14px 18px 0; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
.brand{font-family:"Oswald"; font-weight:700; letter-spacing:.14em; font-size:1.45rem; text-transform:uppercase}
.brand{color:inherit;text-decoration:none;display:inline-block;min-height:44px;line-height:44px}
.brand b{color:var(--brass2)}
.brand .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--brass);margin:0 2px 0 1px;box-shadow:0 0 12px var(--brass)}
.tagline{font-family:"Space Mono"; font-size:.75rem; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); margin-left:auto}
nav.tabs{max-width:1180px;margin:0 auto;padding:10px 8px 0;display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto; color:var(--muted); text-decoration:none;
  font-family:"Oswald"; font-weight:500; letter-spacing:.08em; text-transform:uppercase; font-size:.82rem;
  padding:11px 15px 13px; border-bottom:2px solid transparent; white-space:nowrap; transition:.18s;
}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--brass2); border-bottom-color:var(--brass)}
.tab .ix{font-family:"Space Mono"; font-size:.75rem; color:var(--brass); margin-right:6px}
.hero{padding:38px 4px 8px}
.kicker{font-family:"Space Mono";font-size:.75rem;letter-spacing:.28em;text-transform:uppercase;color:var(--brass)}
h1.title{font-family:"Oswald";font-weight:700;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(1.9rem,5vw,3.1rem);line-height:1.02;margin:.25em 0 .15em}
h1.title em{font-style:normal;color:var(--brass2)}
.lede{max-width:62ch;color:var(--muted);font-size:1.02rem}
h2.sec{font-family:"Oswald";font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:1.5rem;margin:34px 0 12px;display:flex;align-items:center;gap:12px}
h2.sec::before{content:"";width:26px;height:2px;background:var(--brass);display:inline-block}
.sub{font-family:"Oswald";font-weight:500;text-transform:uppercase;letter-spacing:.06em;font-size:1.06rem;color:var(--brass2);margin:0 0 6px}
.note{color:var(--muted);font-size:.92rem;margin:0}
.panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:820px){.g3,.g2{grid-template-columns:1fr}}
.pillrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding-bottom:18px}
.pill{font-family:"Space Mono";font-size:.75rem;letter-spacing:.06em;border:1px solid var(--line2);border-radius:20px;padding:5px 11px;color:var(--ink)}
.pill.good{border-color:rgba(98,185,134,.5);color:var(--green)}
.pill.chalk{border-color:rgba(84,182,214,.5);color:var(--chalk)}
.pill.amber{border-color:rgba(231,162,62,.5);color:var(--amber)}
a.navcard{display:block;color:inherit;text-decoration:none;position:relative;transition:transform .14s ease, border-color .14s ease}
a.navcard:hover{transform:translateY(-2px); border-color:var(--brass)}
a.navcard:active{transform:translateY(0)}
a.navcard:focus-visible{outline:2px solid var(--brass); outline-offset:2px}
a.navcard::after{content:"open →"; position:absolute; right:14px; bottom:12px; font-family:"Space Mono"; font-size:.75rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.btn{
  cursor:pointer;border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--ink);
  font-family:"Oswald";font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:.78rem;
  min-height:44px;padding:9px 13px;border-radius:9px;transition:.15s;text-align:center;
}
.btn:focus-visible{outline:2px solid var(--brass2);outline-offset:2px}
.btn:hover{border-color:var(--brass-dim);color:var(--brass2)}
.btn.active{background:var(--brass);color:#1a1206;border-color:var(--brass);font-weight:700}
#update{display:block;width:100%;margin-top:18px}
.door .btn{min-height:64px;width:100%}
h1[tabindex="-1"]:focus{outline:none}
#update[hidden]{display:none}
.hint{font-size:.82rem;color:var(--muted);font-family:"Space Mono";letter-spacing:.04em;margin:8px 0 0}
footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-family:"Space Mono";font-size:.75rem;letter-spacing:.06em}
.spin{display:flex;flex-direction:column;align-items:center;gap:6px}
.spin-pad{width:96px;height:96px;border-radius:50%;background:#f2eedd;position:relative;touch-action:none}
.spin-tip{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--chalk);pointer-events:none}
.spin-label{font-family:"Space Mono";font-size:.75rem;color:var(--ink)}
.speed input[type=range]{width:100%;min-height:44px}
.speed-row{display:flex;align-items:center;gap:8px}
.speed-btn{min-width:44px;min-height:44px}
.speed-out{display:block;font-family:"Space Mono";font-size:.75rem;color:var(--ink)}
canvas.felt{display:block;width:100%;height:auto;aspect-ratio:110/60;touch-action:manipulation}
canvas.felt:focus-visible{outline:2px solid var(--brass2);outline-offset:2px}
.btn:disabled,.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.spin-pad[aria-disabled=true]{opacity:.45}
.studio{display:grid;gap:8px;padding-top:8px;grid-template-areas:"status" "table" "controls"}
.area-status{grid-area:status}
.area-table{grid-area:table}
.area-controls{grid-area:controls;display:grid;gap:8px;align-content:start}
.studio [hidden]{display:none!important}
.studio[hidden]{display:none}
@media(min-width:900px){.studio{grid-template-columns:62% 1fr;grid-template-areas:"table status" "table controls";grid-template-rows:auto 1fr;gap:16px}}
.screen-title{font-family:"Oswald";text-transform:uppercase;font-size:1.1rem;margin:0}
.status{font-family:"Space Mono";font-size:.8rem;color:var(--muted);margin:0}
.notice{margin:4px 0 0;color:var(--amber);font-size:.9rem}
.table-msg{color:var(--muted);margin:0}
.nudges{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tip-speed{display:flex;gap:12px;align-items:center}
.tip-speed [data-slot=speed]{flex:1}
.shoot-row{display:flex;gap:8px}
.shoot-row .btn{min-height:52px}
.shoot-row .primary{flex:2}
.shoot-row .btn:not(.primary){flex:1}
.aiming>p,.result .panel p{margin:4px 0}
.result-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.studio .panel{padding:12px}
.verdict{font-family:"Oswald";text-transform:uppercase;font-size:1.1rem}
.total,.context{font-family:"Space Mono";font-size:.85rem}
.tone-red{color:var(--red)}
.tone-amber{color:var(--amber)}
.tone-green{color:var(--green)}
.links a,.summary a{display:inline-block;min-height:44px;line-height:44px;padding:0 6px;color:var(--brass2)}
.linkbox{min-height:44px;width:100%;font-family:"Space Mono";font-size:.8rem}
.summary table{width:100%;border-collapse:collapse;margin:12px 0}
.summary th,.summary td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
